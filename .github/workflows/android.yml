name: Android

on:
  workflow_dispatch:
    inputs:
      release:
        description: Build a signed release APK and App Bundle (dev branch only)
        type: boolean
        default: false
      upload_play:
        description: Upload the signed App Bundle to Google Play testing (requires release=true, dev only)
        type: boolean
        default: false
      play_track:
        description: Google Play testing track
        type: choice
        options: [internal, beta]
        default: internal
      play_status:
        description: Save a draft or roll out to testers
        type: choice
        options: [draft, completed]
        default: draft
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      pass-key:
        type: string
        default: ''
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        required: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release || false }}
  cancel-in-progress: ${{ inputs.release != true }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ZERUN_CHINA_MIRRORS: 'false'
      ZERON_ANDROID_ABIS: ${{ inputs.release == true && 'arm64-v8a' || 'arm64-v8a x86_64' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate Play upload request
        if: inputs.upload_play == true
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          [[ "$RELEASE" == true && "$GITHUB_REF" == refs/heads/dev && "$GITHUB_EVENT_NAME" == workflow_dispatch ]] \
            || { echo 'Play uploads require a manual dev build with release=true.' >&2; exit 2; }

      - name: Prepare release signing
        if: inputs.release == true
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/dev && "$GITHUB_REF_TYPE" != tag ]]; then
            echo "Signed Android builds must use dev or a release tag." >&2
            exit 2
          fi
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "Required repository secret $name is not configured." >&2; exit 2; }
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zerun-release.keystore"
          echo "ZERUN_ANDROID_KEYSTORE=$RUNNER_TEMP/zerun-release.keystore" >> "$GITHUB_ENV"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Use official Gradle distribution
        run: sed -i 's@mirrors.huaweicloud.com/gradle/@services.gradle.org/distributions/@' apps/android/gradle/wrapper/gradle-wrapper.properties

      # Its default cache is read-only off the default branch, as for the Rust
      # cache below: a release tag's or a PR's cache is unreachable from other
      # refs and would evict the default branch's.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Android SDK and system dependencies
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'ndk;29.0.14206865'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin

      - name: Rust toolchain and Android targets
        run: |
          rustup update stable --no-self-update
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android
          if [[ "$ZERON_ANDROID_ABIS" == *x86_64* ]]; then
            rustup target add x86_64-linux-android
          fi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android-mobile-ndk29
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2

      - name: Test and build debug APK
        if: inputs.release != true
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain

      - name: Test, sign and verify release APK and App Bundle
        if: inputs.release == true
        env:
          ZERUN_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ZERUN_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ZERUN_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/package-android.sh

      - name: Remove release keystore
        if: always() && inputs.release == true
        run: rm -f "$RUNNER_TEMP/zerun-release.keystore"

      - name: Upload debug APK
        if: inputs.release != true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Android UI test APK
        if: inputs.release != true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-ui-tests
          path: apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

      - name: Upload release APK, App Bundle and checksums
        if: inputs.release == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release
          path: |
            target/package/zerun-*-android.apk*
            target/package/zerun-*-android.aab*
          if-no-files-found: error

      - name: Upload Play App Bundle and checksum
        if: inputs.upload_play == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-aab
          path: target/package/zerun-*-android.aab*
          if-no-files-found: error
          retention-days: 90

      - name: Upload failing unit test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-test-reports
          path: apps/android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: inputs.pass-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-build

  play:
    name: Upload to Google Play testing
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' &&
      inputs.release == true && inputs.upload_play == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: android-google-play
      cancel-in-progress: false
    env:
      PLAY_TRACK: ${{ inputs.play_track }}
      PLAY_STATUS: ${{ inputs.play_status }}
    steps:
      - name: Check Play configuration
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [[ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]] \
            || { echo 'Set GOOGLE_PLAY_SERVICE_ACCOUNT_JSON in repository secrets.' >&2; exit 2; }
          case "$PLAY_TRACK" in internal|beta) ;; *) echo 'Only testing tracks are supported.' >&2; exit 2;; esac
          case "$PLAY_STATUS" in draft|completed) ;; *) echo 'Use draft or completed for the release status.' >&2; exit 2;; esac
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-aab
          path: out/android
      - name: Verify bundle checksum
        working-directory: out/android
        run: sha256sum -c ./*.aab.sha256
      - name: Upload signed bundle
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: work.puqing.zerun.android
          releaseFiles: out/android/*.aab
          tracks: ${{ env.PLAY_TRACK }}
          status: ${{ env.PLAY_STATUS }}

  execution-ui:
    if: inputs.release != true
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: android-*
          merge-multiple: true
          path: ${{ runner.temp }}/android-apks
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Prepare emulator
        run: |
          sudo chmod 666 /dev/kvm
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Verify and capture permission and Plan controls
        timeout-minutes: 10
        run: bash scripts/android/test-execution-controls.sh
      - name: Upload Android execution screenshots and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: execution-android-screenshots
          path: ${{ runner.temp }}/execution-android/
          if-no-files-found: error
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: inputs.pass-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-execution-ui

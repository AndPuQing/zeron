name: Desktop Beta

# Zerun's beta channel: the zgx interface (apps/zgx, its `beta` feature) as the
# Zerun app itself, with the engine built from this same commit inside, on
# macOS (scripts/package-zgx-beta.sh), Linux (scripts/package-linux.sh) and
# Windows (scripts/package-windows.ps1). The point of a beta is to test what's
# next, the engine too. Testers keep their data and device; the app updates
# itself from the beta channel and goes back to
# Stable when they turn beta off (crates/update `channel`).
#
# Signed as release.yml signs: macOS only. Linux and Windows aren't signed.
#
# Published to the beta channel only — R2 `zerun-releases/beta/*`
# (edge.550w.host/releases/beta/*, the manifest last) — and as a GitHub
# pre-release that's never the latest. It never writes release.yml's
# channel: not `zerun-releases/manifest.json`, not `latest.txt`.
#
# Trigger: push a tag `beta-v<workspace version>-beta.<n>`, the workspace
# version being the next release's (newer than the latest stable):
#   git tag beta-v0.3.30-beta.1 && git push origin beta-v0.3.30-beta.1
# or run it by hand with a version (builds and uploads the artifacts, no
# release, no channel), and optionally only some of the platforms.
#
on:
  push:
    tags: ["beta-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: The beta's version, <workspace version>-beta.<n>.
        type: string
        required: true
      platforms:
        description: Which to build (a run by hand).
        type: string
        default: macos linux windows
      macos_runner:
        description: Apple Silicon runner pool
        type: choice
        default: macos-15
        options: [macos-15, xcode-27]

permissions:
  contents: read

# Build-only platform selections can run independently; tag publication is serialized.
concurrency:
  group: zgx-beta-${{ github.ref }}-${{ inputs.version }}-${{ inputs.platforms }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
      engine: ${{ steps.version.outputs.engine }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: version (beta-v<workspace version>-beta.<n>, newer than stable)
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          workspace="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#beta-v}"
          else
            version="$VERSION_INPUT"
          fi
          case "$version" in
            "$workspace"-beta.*) ;;
            *) echo "$version is not $workspace-beta.<n> (Cargo.toml's version is $workspace)"; exit 1 ;;
          esac
          number="${version#"$workspace"-beta.}"
          case "$number" in
            ''|*[!0-9]*) echo "the beta number '$number' is not a number"; exit 1 ;;
          esac
          stable="$(curl -fsS --connect-timeout 20 --max-time 60 --retry 3 https://edge.550w.host/releases/latest.txt)"
          # A Beta is of the next release and carries its matching engine.
          if [ "$(printf '%s\n%s\n' "$stable" "$workspace" | sort -V | tail -1)" != "$workspace" ] || [ "$stable" = "$workspace" ]; then
            echo "the workspace's $workspace isn't newer than stable $stable: bump it first"; exit 1
          fi
          {
            echo "version=$version"
            echo "stable=$stable"
            echo "engine=$version"
          } >>"$GITHUB_OUTPUT"

  # Apple silicon only, as release.yml's macOS build.
  macos:
    needs: version
    if: github.event_name == 'push' || contains(inputs.platforms, 'macos')
    runs-on: ${{ inputs.macos_runner || 'macos-15' }}
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use the alternate pool's selected Xcode
        if: inputs.macos_runner == 'xcode-27'
        run: echo "DEVELOPER_DIR=$(env -u DEVELOPER_DIR xcode-select -p)" >> "$GITHUB_ENV"
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      # zgx's terminals are Ghostty's, built with Zig 0.16 (zgx-ghostty-sys).
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/zgx-ghostty
          key: zgx-ghostty-${{ hashFiles('apps/zgx/Cargo.lock') }}
          restore-keys: zgx-ghostty-
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: zgx-beta
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true
          workspaces: |
            . -> target
            apps/zgx -> target
      - name: the engine, from this commit
        env:
          ZERUN_ENGINE_VERSION: ${{ needs.version.outputs.version }}
        run: cargo build --release --locked -p zeron --bin zerun-engine --no-default-features
      - name: import Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          pass="$(openssl rand -hex 16)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 -d >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "p12 contains no Developer ID Application identity"; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >>"$GITHUB_ENV"
      - name: notary credentials
        if: env.AC_API_KEY_P8 != ''
        run: |
          printf '%s' "$AC_API_KEY_P8" >"$RUNNER_TEMP/ac_api_key.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/ac_api_key.p8"
            echo "NOTARY_KEY_ID=$AC_API_KEY_ID"
            echo "NOTARY_ISSUER_ID=$AC_API_ISSUER_ID"
          } >>"$GITHUB_ENV"
      - name: Update and launch regressions
        env:
          ZERUN_ENGINE_VERSION: ${{ needs.version.outputs.version }}
        run: cargo test --release --locked -p zeron-update -p zeron-launch --lib
      - name: package dmg
        env:
          BETA_VERSION: ${{ needs.version.outputs.version }}
          CARGO_FLAGS: --locked
        run: ZGX_BETA_ENGINE="$GITHUB_WORKSPACE/target/release/zerun-engine" scripts/package-zgx-beta.sh
      - name: inspect the bundle
        env:
          BETA_VERSION: ${{ needs.version.outputs.version }}
          ENGINE: ${{ needs.version.outputs.engine }}
        run: |
          app="target/package-beta/Zerun.app"
          plist="$app/Contents/Info.plist"
          plutil -p "$plist"
          test "$(plutil -extract CFBundleIdentifier raw "$plist")" = work.puqing.zerun
          test "$(plutil -extract ZeronVersion raw "$plist")" = "$BETA_VERSION"
          test "$("$app/Contents/MacOS/zerun" --version)" = "zerun $BETA_VERSION"
          test -x "$app/Contents/MacOS/Zerun Engine"
          test -f "$app/Contents/Resources/ui/app.luau"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - "$app"
          if [ -n "${NOTARY_KEY_PATH:-}" ]; then
            spctl --assess --type execute --verbose=2 "$app"
            # Ticket validation also contacts Apple's CloudKit service.
            for attempt in 1 2 3; do
              xcrun stapler validate "$app" && break
              [ "$attempt" -lt 3 ] || exit 1
              sleep 10
            done
          fi
          test "$(plutil -extract ZeronEngineVersion raw "$plist")" = "$ENGINE"
          du -sh "$app"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zgx-beta-macos-${{ runner.arch }}
          path: |
            target/package-beta/*.dmg
            target/package-beta/*.tar.gz
          if-no-files-found: error

  linux:
    needs: version
    if: github.event_name == 'push' || contains(inputs.platforms, 'linux')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04 # x86_64
          - runner: ubuntu-24.04-arm # aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: system deps (release.yml's)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libdbus-1-dev rsync libwebkit2gtk-4.1-dev libjson-glib-dev
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: zgx-beta
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          workspaces: |
            . -> target
            apps/zgx -> target
      - name: the engine, from this commit
        env:
          ZERUN_ENGINE_VERSION: ${{ needs.version.outputs.version }}
        run: cargo build --release --locked -p zeron --bin zerun-engine --no-default-features
      - name: Update and launch regressions
        env:
          ZERUN_ENGINE_VERSION: ${{ needs.version.outputs.version }}
        run: cargo test --release --locked -p zeron-update -p zeron-launch --lib
      - name: package
        env:
          BETA_VERSION: ${{ needs.version.outputs.version }}
        run: ZGX_BETA_ENGINE="$GITHUB_WORKSPACE/target/release/zerun-engine" scripts/package-linux.sh
      - name: inspect and install the tarball
        env:
          BETA_VERSION: ${{ needs.version.outputs.version }}
          ENGINE: ${{ needs.version.outputs.engine }}
        run: |
          beta_home="$RUNNER_TEMP/beta-home"
          mkdir -p "$RUNNER_TEMP/unpacked" "$beta_home"
          tar -xzf "target/package/zerun-$BETA_VERSION-linux-$(uname -m).tar.gz" -C "$RUNNER_TEMP/unpacked"
          dir="$RUNNER_TEMP/unpacked/zerun-$BETA_VERSION-linux-$(uname -m)"
          test "$("$dir/zerun" --version)" = "zerun $BETA_VERSION"
          test "$("$dir/zerun-engine" --version)" = "zerun-engine $ENGINE"
          test -f "$dir/ui/app.luau"
          test -d "$dir/plugins-builtin"
          test ! -e "$dir/ui/tests"
          # Its install.sh, in a home of its own: a beta's directory, `current` on it.
          HOME="$beta_home" "$dir/install.sh"
          test "$(basename "$(readlink "$beta_home/.zerun/app/current")")" = "$BETA_VERSION"
          test "$("$beta_home/.zerun/app/current/zerun" --version)" = "zerun $BETA_VERSION"
          du -sh "$dir"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zgx-beta-linux-${{ runner.arch }}
          path: target/package/*.tar.gz
          if-no-files-found: error

  windows:
    needs: version
    if: github.event_name == 'push' || contains(inputs.platforms, 'windows')
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      # The scripts ship as they are on the other platforms: no CRLF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: zgx-beta
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true
          workspaces: |
            . -> target
            apps/zgx -> target
      # Match the other Beta platforms: bundle the engine without the stable UI.
      - name: the engine, from this commit
        env:
          ZERUN_ENGINE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cargo build --release --locked -p zeron --bin zerun-engine --no-default-features
          if ($LASTEXITCODE -ne 0) { throw 'the engine failed to build' }
          "BETA_ENGINE=$((Resolve-Path -LiteralPath './target/release/zerun-engine.exe').Path)" >> $env:GITHUB_ENV
      # The feed's base is the edge's: its `beta/` is the beta channel, and
      # stable's manifest and files, for going back, are beside it.
      - name: Update and launch regressions
        env:
          ZERUN_ENGINE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cargo test --release --locked -p zeron-update -p zeron-launch --lib
          if ($LASTEXITCODE -ne 0) { throw 'Update and launch tests failed' }
      - name: package installer and portable app
        env:
          BETA_VERSION: ${{ needs.version.outputs.version }}
        run: ./scripts/package-windows.ps1 -ReleasesUrl https://edge.550w.host/releases -BetaVersion $env:BETA_VERSION -BetaEngine $env:BETA_ENGINE
      - name: inspect the package
        env:
          BETA_VERSION: ${{ needs.version.outputs.version }}
          ENGINE: ${{ needs.version.outputs.engine }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'unpacked'
          Expand-Archive -LiteralPath "target/package/zerun-$env:BETA_VERSION-windows-x86_64.zip" -DestinationPath $dir
          $interface = (& "$dir/zerun.exe" --version | Out-String).Trim()
          if ($interface -ne "zerun $env:BETA_VERSION") { throw "the interface says '$interface'" }
          $beta = "$dir/beta/$env:BETA_VERSION"
          $engine = (& "$beta/engine/zerun-engine.exe" --version | Out-String).Trim()
          if ($engine -ne "zerun-engine $env:ENGINE") { throw "the engine says '$engine'" }
          foreach ($path in @("$beta/ui/app.luau", "$beta/plugins-builtin", "$dir/zerun-update.json")) {
            if (-not (Test-Path -LiteralPath $path)) { throw "no $path in the package" }
          }
          if (Test-Path -LiteralPath "$beta/ui/tests") { throw 'the tests are in the package' }
          $feed = (Get-Content -Raw "$dir/zerun-update.json" | ConvertFrom-Json).releases_url
          if ($feed -ne 'https://edge.550w.host/releases') { throw "the feed is $feed" }
          $identity = (Get-Content -Raw "$dir/zerun-update.json" | ConvertFrom-Json).application_id
          if ($identity -ne 'work.puqing.zerun') { throw "the application id is $identity" }
          if ((Get-Content -Raw "$dir/zerun-version").Trim() -ne $env:BETA_VERSION) { throw 'wrong installed version' }
          Get-ChildItem target/package -File | Select-Object Name, Length
      - name: Install and uninstall the Beta
        env:
          BETA_VERSION: ${{ needs.version.outputs.version }}
        run: ./scripts/test-windows-installer.ps1 -Setup "target/package/zerun-$env:BETA_VERSION-windows-x86_64-setup.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zgx-beta-windows-${{ runner.arch }}
          path: |
            target/package/*.zip
            target/package/*.exe
          if-no-files-found: error

  # The GitHub pre-release: never the latest release (Zerun's updater and
  # download links follow releases/latest), with the beta's manifest.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/beta-v')
    needs: [version, macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ENGINE: ${{ needs.version.outputs.engine }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: artifacts and the beta manifest
        run: |
          ls -l dist/
          # Stable's artifacts, but for a standalone Windows .exe: the beta
          # can't run without the folder beside it.
          for platform in linux-x86_64.tar.gz linux-aarch64.tar.gz \
              macos-arm64.dmg macos-arm64-app.tar.gz \
              windows-x86_64.zip windows-x86_64-setup.exe; do
            test -f "dist/zerun-$VERSION-$platform" \
              || { echo "missing artifact for $VERSION: $platform"; exit 1; }
          done
          # crates/update's Manifest: the beta's version, the engine it
          # carries (a switch back to Stable weighs it) and its macOS floor,
          # which only macOS reads.
          manifest=$(jq -n --arg version "$VERSION" --arg engine "$ENGINE" \
            '{version: $version, engineVersion: $engine, minimumMacOS: "13.0", files: {}}')
          for f in dist/*; do
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            manifest=$(jq --arg name "$(basename "$f")" --arg sha "$sha" \
              '.files[$name] = {sha256: $sha}' <<<"$manifest")
          done
          printf '%s' "$manifest" > beta-manifest.json
          cat beta-manifest.json
      # Published releases are immutable and take no more files, and this
      # action publishes a prerelease before uploading unless it's a draft. So:
      # a draft, its files, then published in the next step.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        id: draft
        with:
          name: Zerun ${{ needs.version.outputs.version }}
          prerelease: true
          draft: true
          make_latest: "false"
          # As release.yml: re-running this job after a failed upload keeps
          # the files already there.
          overwrite_files: false
          files: |
            dist/*
            beta-manifest.json
          body: |
            Zerun ${{ needs.version.outputs.version }}: the new desktop interface with a matching engine.

            - Replaces the installed desktop and keeps your account, device and conversations.
            - Once installed, it follows the Beta update channel. Turn off **Get beta updates** in Settings → About & updates to return to stable once its engine catches up; older engines are never installed automatically.
            - macOS 13 or later on Apple silicon; Linux x86_64 and aarch64 (run `install.sh` from the tarball); Windows x86_64 (the installer or the zip).
      - name: publish the draft (a prerelease, never the latest)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          # (Published already when this job runs again.)
          if [ "$(gh api "$endpoint" --jq .draft)" = true ]; then
            gh api -X PATCH "$endpoint" -F draft=false -F prerelease=true -f make_latest=false --jq '{tag_name, draft, prerelease}'
          fi
          test "$(gh api "$endpoint" --jq '.draft')" = false
          test "$(gh api "$endpoint" --jq '.prerelease')" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" != "$GITHUB_REF_NAME"

  # The beta channel on R2: edge.550w.host/releases/beta/*. Every key is under
  # `beta/`: never the stable manifest.json or latest.txt.
  channel:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/beta-v')
    needs: [version, macos, linux, windows, release]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 808eccb28c4b8ff2386cb40c20704b22
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: the manifest the release carries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern beta-manifest.json --dir .
      - name: upload to R2 (edge.550w.host/releases/beta/*)
        run: |
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required for the Beta update feed}"
          put() {
            case "$1" in
              beta/?*) ;;
              *) echo "refusing to write $1: only beta/* is this workflow's"; exit 1 ;;
            esac
            # The Cloudflare API returns the odd 502; retry each object.
            for attempt in 1 2 3 4 5; do
              npx wrangler@4 r2 object put "zerun-releases/$1" --file "$2" --remote && return 0
              echo "upload of $1 failed (attempt $attempt), retrying" >&2
              sleep $((attempt * 10))
            done
            return 1
          }
          for f in dist/*; do
            put "beta/$(basename "$f")" "$f"
          done
          # Last, so no reader sees a version before its files.
          put beta/manifest.json beta-manifest.json

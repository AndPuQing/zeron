name: release

# Build release artifacts and publish them:
#   - Linux headless tarballs (x86_64 + aarch64) via scripts/package-linux.sh
#   - macOS dmg (Apple silicon) via scripts/package-macos.sh
#   - Windows per-user installer, portable zip, and updater exe (x86_64) via
#     scripts/package-windows.ps1
#   - Android signed universal APK (arm64-v8a + x86_64)
# then create a GitHub Release AND upload everything to the
# `zerun-releases` R2 bucket (served at zerun.puqing.work/releases/* for
# `curl -fsSL https://zerun.puqing.work/install.sh | sh`), bumping latest.txt.
#
# Trigger: push a tag `v<version>` matching the workspace version in
# Cargo.toml (bump it in the same commit), or run manually via
# workflow_dispatch (builds only by default; publish_run_id + publish_tag
# recover publication from a matching tag whose platform builds all passed).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: Recover publication from a release run whose platform builds all passed (blank builds only)
        type: string
        default: ''
      publish_tag:
        description: Existing version tag for publication recovery, e.g. v0.3.2
        type: string
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  cursor-compatibility:
    if: inputs.publish_run_id == ''
    uses: ./.github/workflows/cursor-compatibility.yml

  android:
    if: inputs.publish_run_id == ''
    uses: ./.github/workflows/android.yml
    with:
      release: true
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  linux:
    if: inputs.publish_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04 # x86_64
          - runner: ubuntu-24.04-arm # aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: gpui system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: package
        run: scripts/package-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ runner.arch }}
          path: target/package/*.tar.gz
          if-no-files-found: error

  # Every platform must build before publishing the release and updater manifest.
  #
  # Signing/notarization (both optional — absent secrets fall back to an
  # ad-hoc-signed build):
  #   MACOS_CERT_P12 / MACOS_CERT_PASSWORD — base64 "Developer ID Application"
  #     certificate + private key (.p12) and its export password.
  #   AC_API_KEY_P8 / AC_API_KEY_ID / AC_API_ISSUER_ID — App Store Connect API
  #     key (raw .p8 contents), for notarytool. All three present → the package
  #     script notarizes and staples the app + dmg (no Gatekeeper warning).
  macos:
    if: inputs.publish_run_id == ''
    runs-on: macos-latest # Apple silicon
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: import Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          pass="$(openssl rand -hex 16)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 -d >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Allow codesign to use the imported key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "p12 contains no Developer ID Application identity"; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >>"$GITHUB_ENV"
      - name: notary credentials
        if: env.AC_API_KEY_P8 != ''
        run: |
          printf '%s' "$AC_API_KEY_P8" >"$RUNNER_TEMP/ac_api_key.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/ac_api_key.p8"
            echo "NOTARY_KEY_ID=$AC_API_KEY_ID"
            echo "NOTARY_ISSUER_ID=$AC_API_ISSUER_ID"
          } >>"$GITHUB_ENV"
      - name: package dmg
        run: scripts/package-macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ runner.arch }}
          path: |
            target/package/*.dmg
            target/package/*.tar.gz
          if-no-files-found: error

  windows:
    if: inputs.publish_run_id == ''
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Locate Windows SDK shader compiler
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe is required for GPUI release shaders' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: package installer and portable app
        run: ./scripts/package-windows.ps1 -ReleasesUrl "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ runner.arch }}
          path: |
            target/package/*.zip
            target/package/*.exe
          if-no-files-found: error

  publish:
    if: >-
      always() && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
         !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
         !contains(needs.*.result, 'skipped')) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' &&
         inputs.publish_run_id != '' && inputs.publish_tag != '')
      )
    needs: [cursor-compatibility, linux, macos, windows, android]
    runs-on: ubuntu-latest
    env:
      # `secrets` is not a valid context in step `if:` expressions — surface
      # the token through job env and gate on that instead.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: fc5a16c75e508b812ee6edd119fd32ae
      SOURCE_RUN_ID: ${{ inputs.publish_run_id || github.run_id }}
      RELEASE_TAG: ${{ inputs.publish_tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.publish_tag || github.ref }}
      - name: Verify publication recovery source
        if: inputs.publish_run_id != ''
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid source run ID'; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/source-jobs.json"
          python3 - <<'PY'
          import json, os, subprocess
          with open(os.environ['RUNNER_TEMP'] + '/source-run.json') as source:
              run = json.load(source)
          with open(os.environ['RUNNER_TEMP'] + '/source-jobs.json') as source:
              jobs = json.load(source)['jobs']
          assert run['event'] == 'push' and run['path'] == '.github/workflows/release.yml', 'Not a tagged release build'
          assert run['head_sha'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'Tag does not match the source build'
          assert run['head_branch'] == os.environ['RELEASE_TAG'], 'Source build has a different tag'
          required = {'android / build', 'linux (ubuntu-24.04)', 'linux (ubuntu-24.04-arm)', 'macos', 'windows', 'cursor-compatibility / cursor-compatibility', 'cursor-compatibility / rust-tests'}
          builds = [job for job in jobs if job['name'] != 'publish']
          assert required <= {job['name'] for job in builds}, 'Missing platform or test jobs'
          assert all(job['conclusion'] == 'success' for job in builds), 'Source builds did not all pass'
          print('Source builds all passed and match the release tag')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/zerun-release-assets
          merge-multiple: true
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: version guard (tag == artifact version)
        run: |
          ver="${RELEASE_TAG#v}"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          [[ "$ver" == "$version" ]] || { echo 'Tag does not match the workspace version'; exit 1; }
          cd "$RUNNER_TEMP/zerun-release-assets"
          ls
          for platform in linux-x86_64.tar.gz linux-aarch64.tar.gz \
              macos-arm64.dmg macos-arm64-app.tar.gz \
              windows-x86_64.zip windows-x86_64.exe windows-x86_64-setup.exe; do
            test -f "zeron-$ver-$platform" \
              || { echo "missing artifact for tag v$ver: $platform — check builds and Cargo.toml version"; exit 1; }
          done
          test -f "zerun-$ver-android.apk" \
            || { echo "missing signed Android APK for tag v$ver"; exit 1; }
          echo "VERSION=$ver" >> "$GITHUB_ENV"
      - name: updater manifest
        run: |
          manifest=$(jq -n --arg version "$VERSION" '{version: $version, files: {}}')
          for f in "$RUNNER_TEMP/zerun-release-assets"/*; do
            test -f "$f" || { echo "Unexpected artifact directory: $f"; exit 1; }
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            manifest=$(jq --arg name "$(basename "$f")" --arg sha "$sha" \
              '.files[$name] = {sha256: $sha}' <<<"$manifest")
          done
          printf '%s' "$manifest" > manifest.json
      - name: Release notes
        run: |
          if [[ -f "docs/releases/$VERSION.md" ]]; then
            cp "docs/releases/$VERSION.md" release-notes.md
          else
            printf '# Zerun %s\n\nDownload the package for your platform below.\n' "$VERSION" > release-notes.md
          fi
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ runner.temp }}/zerun-release-assets/*
            manifest.json
          body_path: release-notes.md
          generate_release_notes: false
          overwrite_files: true
      - name: upload to R2 (zerun.puqing.work/releases/*)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          if [[ "${{ inputs.publish_run_id != '' }}" == true ]]; then
            # Remove files uploaded by the interrupted publication before the
            # isolated artifact set is written again.
            for stale in README.md zeron.desktop zeron.png zeron.svg macos; do
              npx wrangler@4 r2 object delete "zerun-releases/$stale" --remote || true
            done
          fi
          for f in "$RUNNER_TEMP/zerun-release-assets"/*; do
            test -f "$f" || { echo "Unexpected artifact directory: $f"; exit 1; }
            npx wrangler@4 r2 object put "zerun-releases/$(basename "$f")" \
              --file "$f" --remote
          done
          # manifest.json: version + per-artifact sha256 — the auto-updater
          # (crates/update) verifies downloads against it. Published before
          # latest.txt so no client ever sees a version without its checksums.
          npx wrangler@4 r2 object put zerun-releases/manifest.json \
            --file manifest.json --remote
          printf '%s' "$VERSION" > latest.txt
          npx wrangler@4 r2 object put zerun-releases/latest.txt \
            --file latest.txt --remote
